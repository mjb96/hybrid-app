version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Production runtime libraries are vendored and reviewed manually.
      # See docs/versioning.md before accepting a major upgrade.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"
